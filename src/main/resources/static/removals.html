<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karlstodian · Removals</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e2e0d8; --row-hover: #f8f7f3;
    --accent: #2f6f4f; --accent-ink: #fff; --accent-soft: #e5f0ea;
    --ok: #2f7d4f; --ok-bg: #e5f2ea; --warn: #9a5b12; --warn-bg: #f7ecd9; --err: #b3412e; --err-bg: #f8e6e2;
    --idle: #8a887f; --idle-bg: #eeede8;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1d1f1c; --ink: #e9e8e2; --muted: #9a998f; --line: #2e302c; --row-hover: #232522;
      --accent: #5fae84; --accent-ink: #0f1a14; --accent-soft: #1f3328;
      --ok: #6cc394; --ok-bg: #1d3327; --warn: #e2b062; --warn-bg: #3a2e1a; --err: #e8846f; --err-bg: #3a221d;
      --idle: #8f8e86; --idle-bg: #262824;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .brand .ver { color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: 0; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; padding: 5px 11px; border-radius: 7px; font-size: 14px; }
  nav a:hover { color: var(--ink); background: var(--idle-bg); }
  nav a.on { color: var(--ink); background: var(--panel); border: 1px solid var(--line); }
  .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .btn { font-weight: 600; font-size: 13px; border-radius: 7px; padding: 5px 11px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.danger { background: var(--err); color: #fff; border-color: var(--err); }
  .btn:disabled { opacity: .55; cursor: default; }
  .banner { border-radius: 9px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.err { background: var(--err-bg); color: var(--err); }
  .banner a { color: inherit; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 8px; display: flex; gap: 10px; align-items: baseline; }
  h2 .n { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actions { text-align: right; white-space: nowrap; }
  .actions .btn + .btn { margin-left: 6px; }
  .title { font-weight: 550; }
  .sub, .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 22px 14px; color: var(--muted); font-size: 14px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--idle-bg); color: var(--idle); margin-left: 6px; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.err { background: var(--err-bg); color: var(--err); }
  .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .err-text { color: var(--err); font-size: 13px; }
  .log td { font-size: 13px; padding: 7px 12px; }
  .log .when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) {
    .hide-sm { display: none; }
    .right { margin-left: 0; width: 100%; }
    td, th { padding-left: 9px; padding-right: 9px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">Karlstodian <span class="ver" id="app-version"></span></span>
    <nav><a href="/library">Library</a><a href="/removals" class="on">Removals</a><a href="/settings">Settings</a></nav>
    <div class="right"><span class="muted" id="run-msg"></span><button class="btn" id="run">Check now</button></div>
  </div>
  <div id="banners"></div>

  <h2>Leaving Soon <span class="n" id="n-leaving"></span></h2>
  <div class="card" id="leaving"></div>

  <h2>Removed, torrents still seeding <span class="n" id="n-seeding"></span></h2>
  <div class="card" id="seeding"></div>

  <h2>Needs attention <span class="n" id="n-failed"></span></h2>
  <div class="card" id="failed"></div>

  <h2>History</h2>
  <div class="card" id="history"></div>

  <h2>Log</h2>
  <div class="card" id="log"></div>
</div>

<script>
fetch('/healthz').then(r => r.json()).then(j => { document.getElementById('app-version').textContent = j.version; }).catch(() => {});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function bytes(b) {
  if (!b) return "0 GB";
  if (b >= 1e12) return (b / 1e12).toFixed(2) + " TB";
  if (b >= 1e9) return (b / 1e9).toFixed(b >= 1e11 ? 0 : 1) + " GB";
  return (b / 1e6).toFixed(0) + " MB";
}
const date = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
const dateTime = iso => iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
function until(iso) {
  const d = (new Date(iso) - Date.now()) / 864e5;
  if (d <= 0) return "due now";
  if (d < 1) return `in ${Math.max(1, Math.round(d * 24))} h`;
  return `in ${Math.ceil(d)} day${Math.ceil(d) === 1 ? "" : "s"}`;
}
async function api(method, url) {
  const r = await fetch(url, { method });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
}
const name = r => `<span class="title">${esc(r.title)}</span> <span class="sub">${r.year ?? ""}${r.kind === "show" ? " · show" : ""}</span>`;
const table = (head, rows, empty) => rows.length
  ? `<table><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table>`
  : `<div class="empty">${empty}</div>`;
const STATE = { done: ["Removed", "ok"], cancelled: ["Kept", ""], failed: ["Failed", "err"], waiting_seed: ["Seeding", "warn"], leaving: ["Leaving", "warn"], removing: ["Removing", "warn"] };

let dryRun = true;
async function load() {
  const [act, hist, log] = await Promise.all([
    api("GET", "/api/removals?state=active"), api("GET", "/api/removals?state=history"), api("GET", "/api/audit?limit=200"),
  ]);
  dryRun = act.dry_run;
  const banners = [];
  if (act.dry_run) banners.push(`<div class="banner warn"><b>Dry run is on.</b> When the grace period ends, titles are only logged as "would be removed"; nothing is deleted. Switch it off in <a href="/settings">Settings</a> once the log looks right.</div>`);
  if (act.plex_sync_error) banners.push(`<div class="banner err">${esc(act.plex_sync_error)}</div>`);
  $("#banners").innerHTML = banners.join("");

  const leaving = act.removals.filter(r => r.state === "leaving" || r.state === "removing");
  const seeding = act.removals.filter(r => r.state === "waiting_seed");
  const failed = hist.removals.filter(r => r.state === "failed");
  const past = hist.removals.filter(r => r.state !== "failed");
  const sum = a => bytes(a.reduce((s, r) => s + r.size_bytes, 0));
  $("#n-leaving").textContent = leaving.length ? `${leaving.length} · ${sum(leaving)}` : "";
  $("#n-seeding").textContent = seeding.length ? `${seeding.length}` : "";
  $("#n-failed").textContent = failed.length ? `${failed.length}` : "";

  $("#leaving").innerHTML = table(
    `<th>Title</th><th class="num">Size</th><th class="num hide-sm">Listed</th><th class="num">Removal due</th><th></th>`,
    leaving.map(r => `<tr><td>${name(r)}</td><td class="num">${bytes(r.size_bytes)}</td><td class="num hide-sm">${date(r.marked_at)}</td>
      <td class="num">${r.state === "removing" ? "removing…" : `${date(r.remove_after)}<div class="sub">${until(r.remove_after)}</div>`}</td>
      <td class="actions">${r.state === "leaving" ? `<button class="btn" data-keep="${r.id}">Keep it</button><button class="btn danger" data-remove="${r.id}">Remove now</button>` : ""}</td></tr>`),
    `Nothing is leaving. Mark titles for removal on the <a href="/library">Library</a> page.`);

  $("#seeding").innerHTML = table(`<th>Title</th><th>Torrent</th><th class="num">Deleted after</th>`,
    seeding.flatMap(r => r.torrents.filter(t => t.state === "pending").map(t =>
      `<tr><td>${name(r)}</td><td class="mono">${esc(t.name)}${t.tracker_host ? `<div class="sub">${esc(t.tracker_host)}</div>` : ""}</td><td class="num">${dateTime(t.seed_until)}</td></tr>`)),
    "No torrents waiting.");

  $("#failed").innerHTML = table(`<th>Title</th><th>What went wrong</th><th></th>`,
    failed.map(r => `<tr><td>${name(r)}</td><td class="err-text">${esc(r.error)}</td>
      <td class="actions"><button class="btn" data-keep="${r.id}">Keep it</button><button class="btn danger" data-remove="${r.id}">Retry</button></td></tr>`),
    "Nothing failed.");

  $("#history").innerHTML = table(`<th>Title</th><th class="num">Size</th><th>Outcome</th><th class="num">When</th>`,
    past.slice(0, 100).map(r => `<tr><td>${name(r)}</td><td class="num">${bytes(r.size_bytes)}</td>
      <td><span class="badge ${STATE[r.state]?.[1] ?? ""}">${STATE[r.state]?.[0] ?? esc(r.state)}</span>${r.dry_run && r.state === "done" ? `<span class="badge">dry run</span>` : ""}</td>
      <td class="num">${date(r.finished_at || r.marked_at)}</td></tr>`),
    "Nothing yet.");

  $("#log").innerHTML = table(`<th>When</th><th>Title</th><th>What happened</th>`,
    log.map(e => `<tr class="log"><td class="when">${dateTime(e.at)}</td><td>${esc(e.title || "")}</td><td>${esc(e.detail || e.action)}${e.dry_run ? ` <span class="badge">dry run</span>` : ""}</td></tr>`),
    "Nothing logged yet.");
  for (const el of document.querySelectorAll("#log tr")) el.classList.add("log");
}

document.body.addEventListener("click", async e => {
  const keep = e.target.closest("[data-keep]"), rem = e.target.closest("[data-remove]");
  if (!keep && !rem) return;
  const btn = keep || rem;
  if (rem && !confirm(dryRun ? "Run this removal now? Dry run is on, so it's only logged." : "Remove it now? Its files are deleted through Radarr/Sonarr, and its torrents once they've seeded long enough. This can't be undone.")) return;
  btn.disabled = true;
  try { await api(keep ? "DELETE" : "POST", keep ? `/api/removals/${keep.dataset.keep}` : `/api/removals/${rem.dataset.remove}/remove`); }
  catch (err) { alert(err.message); }
  await load();
});
$("#run").onclick = async () => {
  $("#run").disabled = true; $("#run-msg").textContent = "Checking…";
  try {
    const r = await api("POST", "/api/removals/run");
    $("#run-msg").textContent = `${r.removed} removed · ${r.cancelled} kept · ${r.torrents_deleted} torrents deleted`;
  } catch (err) { $("#run-msg").textContent = err.message; }
  $("#run").disabled = false;
  await load();
};
load().catch(e => { $("#banners").innerHTML = `<div class="banner err">Couldn't load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
