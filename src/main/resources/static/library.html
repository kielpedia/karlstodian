<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karlstodian · Library</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 16px 96px; }
  .scan { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .scan-status { font-size: 13px; color: var(--muted); text-align: right; }
  .scan-status.err { color: var(--err); }

  /* summary: library size, the split, free space */
  .summary { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px 32px; flex-wrap: wrap; margin: 4px 0 18px; }
  .summary .total { font-size: 34px; font-weight: 750; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .summary .split { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .summary .split b { color: var(--ink); font-weight: 600; }
  .disk { min-width: 260px; flex: 0 1 380px; font-size: 13px; color: var(--muted); }
  .disk .row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .disk b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 8px; background: var(--idle-bg); border-radius: 99px; overflow: hidden; display: flex; }
  .meter i { display: block; height: 100%; }
  .meter .free { background: var(--accent); }
  .meter .coming { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 3px, transparent 3px, transparent 6px); opacity: .55; }
  .meter.short .free { background: var(--warm); }

  /* callouts */
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 9px 14px; font-size: 13px; margin-bottom: 12px; }
  .sugbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 10px; padding: 9px 10px 9px 14px; font-size: 14px; margin-bottom: 14px; }
  .sugbar .grow { flex: 1; min-width: 200px; }
  .sugbar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .seg { display: inline-flex; background: var(--idle-bg); border-radius: 9px; padding: 3px; flex: none; }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; cursor: pointer; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .seg svg { width: 15px; height: 15px; }
  .search { position: relative; flex: 1 1 220px; max-width: 320px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  input[type=search] { font: 14px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px 6px 32px; width: 100%; }
  .sortbox { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); margin-left: auto; }
  select { font: 14px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; }
  .icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; width: 32px; height: 32px; cursor: pointer; display: inline-grid; place-items: center; color: var(--muted); }
  .icon-btn:hover, .icon-btn.on { color: var(--ink); border-color: var(--muted); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* filter chips with counts (they replace the old tiles) */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--ink); }
  .chip:hover { border-color: var(--muted); }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip.on .n { color: color-mix(in srgb, var(--bg) 70%, transparent); }
  .chip.zero { opacity: .55; }
  .resultline { font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; display: flex; gap: 12px; align-items: center; }

  /* weights */
  .weights { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .weights-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .weights-head b { font-size: 14px; }
  .weights-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 22px; }
  .w label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .w label b { color: var(--ink); font-weight: 600; }
  .w label span { font-variant-numeric: tabular-nums; }
  .w input[type=range] { width: 100%; accent-color: var(--accent); }
  .w p { margin: 0; font-size: 12px; color: var(--muted); }

  /* posters (grid, list thumbnails, drawer) */
  .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10%;
        font-weight: 700; letter-spacing: -0.02em; color: rgba(255,255,255,.92);
        background: linear-gradient(160deg, hsl(var(--h) 32% 42%), hsl(calc(var(--h) + 40) 30% 22%)); }
  .ph span { font-size: 15px; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .pimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
  .pimg.ok { opacity: 1; }

  /* grid view */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 22px 16px; }
  .card { cursor: pointer; min-width: 0; }
  .poster { position: relative; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: var(--idle-bg); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .card:hover .poster { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .card.sel .poster { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card.picked .poster { outline: 3px solid var(--err); outline-offset: 2px; }
  .poster .shade-b { position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(transparent, rgba(0,0,0,.72)); pointer-events: none; }
  .sc { position: absolute; left: 8px; bottom: 8px; min-width: 34px; padding: 2px 7px; border-radius: 7px; text-align: center;
        font-weight: 750; font-size: 14px; font-variant-numeric: tabular-nums; color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
  .sc.hot { background: var(--hot); } .sc.warm { background: var(--warm); color: #1b1300; }
  .sc.na { font-size: 11px; font-weight: 600; background: rgba(0,0,0,.55); }
  .psize { position: absolute; right: 8px; bottom: 9px; font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
  .flags { position: absolute; left: 8px; top: 8px; right: 38px; display: flex; flex-wrap: wrap; gap: 4px; }
  .flag { font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 6px; color: #fff; background: rgba(0,0,0,.6); white-space: nowrap; }
  .flag.sugg { background: var(--accent); color: var(--accent-ink); }
  .flag.leave { background: var(--err); }
  .flag.keep { background: var(--ok); }
  .flag.noplex { background: var(--warm); color: #1b1300; }
  .pick { position: absolute; right: 7px; top: 7px; width: 26px; height: 26px; border-radius: 7px; background: rgba(0,0,0,.5);
          display: grid; place-items: center; opacity: 0; transition: opacity .12s; cursor: pointer; }
  .pick input { width: 16px; height: 16px; accent-color: var(--err); cursor: pointer; margin: 0; }
  .card:hover .pick, .selecting .pick, .pick:has(input:checked) { opacity: 1; }
  .cap { padding: 8px 2px 0; }
  .cap .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* list view */
  .tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; cursor: pointer; background: var(--panel-2); }
  th:hover { color: var(--ink); }
  th .arr { display: inline-block; width: 1em; color: var(--accent); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  #rows tr { cursor: pointer; }
  #rows tr:hover { background: var(--row-hover); }
  #rows tr.sel { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tcell { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .thumb { position: relative; width: 34px; height: 51px; border-radius: 5px; overflow: hidden; flex: none; background: var(--idle-bg); }
  .thumb .ph span { font-size: 10px; }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; font-weight: 400; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--idle-bg); color: var(--idle); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.leave { background: var(--err-bg); color: var(--err); }
  .badge.sugg { background: var(--accent-soft); color: var(--accent); }
  .sizecell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .sizebar { width: 56px; height: 5px; background: var(--idle-bg); border-radius: 3px; overflow: hidden; flex: none; }
  .sizebar i { display: block; height: 100%; background: var(--bar); }
  .never { color: var(--muted); }
  .q-low { color: var(--warn); font-weight: 600; }
  .q-ex { color: var(--muted); text-decoration: line-through; }
  .scorecell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-weight: 700; font-variant-numeric: tabular-nums; }
  .scorebar { width: 44px; height: 6px; background: var(--idle-bg); border-radius: 3px; overflow: hidden; flex: none; }
  .scorebar i { display: block; height: 100%; background: var(--cool); }
  .scorebar.hot i { background: var(--hot); } .scorebar.warm i { background: var(--warm); }
  .excl { color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }
  th.ck, td.ck { width: 34px; padding-right: 0; cursor: default; }
  td.ck input, th.ck input { width: 16px; height: 16px; accent-color: var(--err); cursor: pointer; }
  td.ck input:disabled { cursor: default; opacity: .35; }

  .empty { padding: 56px 16px; text-align: center; color: var(--muted); }
  .more { display: block; margin: 22px auto 0; padding: 8px 18px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 14px; }
  .more:hover { border-color: var(--muted); }

  /* selection bar */
  .selbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 10px 18px;
            box-shadow: var(--shadow-lg); z-index: 5; max-width: calc(100vw - 32px); flex-wrap: wrap; }
  .selbar b { font-variant-numeric: tabular-nums; }

  /* drawer */
  .shade { position: fixed; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 7; }
  .shade.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); z-index: 8;
            transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); overflow-y: auto; box-shadow: var(--shadow-lg); }
  .drawer.open { transform: none; }
  .hero { position: relative; min-height: 230px; background: #1b1d1a; color: #fff; overflow: hidden; }
  .hero .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
  .hero .art.ok { opacity: .55; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.85) 100%); }
  .hero-body { position: relative; z-index: 1; display: flex; gap: 18px; align-items: flex-end; padding: 56px 22px 20px; }
  .hposter { position: relative; width: 112px; aspect-ratio: 2 / 3; border-radius: 9px; overflow: hidden; flex: none; box-shadow: 0 8px 24px rgba(0,0,0,.5); background: #2a2d28; }
  .hinfo { min-width: 0; flex: 1; }
  .hinfo h2 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; }
  .hinfo .meta { font-size: 13px; opacity: .85; margin-top: 4px; }
  .hinfo .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .hinfo .tags span { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: rgba(255,255,255,.16); }
  .hscore { text-align: center; flex: none; }
  .hscore b { display: block; font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .hscore.hot b { color: #ff9b7a; } .hscore.warm b { color: #f3c46d; }
  .hscore span { font-size: 11px; opacity: .75; text-transform: uppercase; letter-spacing: .08em; }
  .x { position: absolute; z-index: 2; top: 14px; right: 14px; border: 0; background: rgba(0,0,0,.45); color: #fff; width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: 18px; line-height: 1; backdrop-filter: blur(4px); }
  .x:hover { background: rgba(0,0,0,.7); }
  .d-body { padding: 4px 22px 40px; }
  .note { background: var(--warn-bg); color: var(--warn); border-radius: 9px; padding: 8px 12px; font-size: 13px; margin-top: 16px; }
  .action { border-radius: 11px; padding: 13px 14px; margin-top: 16px; border: 1px solid var(--line); }
  .action .head { font-weight: 650; }
  .action .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .action.leave { border-color: color-mix(in srgb, var(--err) 45%, transparent); background: var(--err-bg); }
  .action.leave .head { color: var(--err); }
  .action.sugg { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
  .action.sugg .head { color: var(--accent); }
  .action.mark { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .action.mark span { font-size: 13px; color: var(--muted); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .toggle b { font-weight: 600; font-size: 14px; display: block; }
  .toggle span { font-size: 12px; color: var(--muted); line-height: 1.35; display: block; }
  .sw { position: relative; width: 40px; height: 23px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw i { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: background .15s; }
  .sw i::after { content: ""; position: absolute; width: 17px; height: 17px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { transform: translateX(17px); }
  .sw input:disabled + i { opacity: .6; cursor: default; }
  .sw input:focus-visible + i { box-shadow: 0 0 0 3px var(--focus); }
  .d-sec { margin-top: 24px; }
  .d-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stats > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .stats .k { font-size: 12px; color: var(--muted); }
  .stats .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .why { width: 100%; border-collapse: collapse; font-size: 13px; }
  .why td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .why tr:last-child td { border-bottom: 0; }
  .why .f { font-weight: 600; width: 80px; }
  .why .pts { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 10px; font-weight: 600; }
  .why .pts .muted { font-weight: 400; }
  .why .bar { height: 5px; background: var(--idle-bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .why .bar i { display: block; height: 100%; background: var(--warm); }
  .mini { width: 100%; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; border-collapse: separate; border-spacing: 0; overflow: hidden; }
  .mini th { cursor: default; font-size: 11px; padding: 7px 10px; }
  .mini th:hover { color: var(--muted); }
  .mini td { padding: 7px 10px; }
  .mini tr:last-child td { border-bottom: 0; }
  .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 13px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 8px; }

  @media (max-width: 980px) {
    .col-added { display: none; }
    .weights-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .summary .total { font-size: 28px; }
    .disk { flex-basis: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 10px; }
    .cap .t { font-size: 13px; }
    .flags .flag { font-size: 10px; padding: 0 5px; }
    .sc { font-size: 12px; min-width: 28px; }
    .psize { display: none; }
    .col-last, .col-q, .sizebar, .scorebar, .thumb { display: none; }
    .search { max-width: none; flex-basis: 100%; order: -1; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 0 16px 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    .sortbox { margin-left: 0; }
    .scan { margin-left: 0; width: 100%; justify-content: space-between; }
    .scan-status { text-align: left; }
    td, th { padding-left: 10px; padding-right: 10px; }
    .toggles { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .action.mark { flex-direction: column; align-items: stretch; }
    .hero-body { padding: 56px 16px 16px; gap: 14px; }
    .hposter { width: 84px; }
    .hinfo h2 { font-size: 20px; }
    .d-body { padding: 4px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <span class="brand">Karlstodian <span class="ver" id="app-version"></span></span>
    <nav><a href="/library" class="on">Library</a><a href="/removals">Removals</a><a href="/settings">Settings</a></nav>
    <div class="scan">
      <span class="scan-status" id="scan-status">…</span>
      <button class="btn primary" id="scan-btn">Scan now</button>
    </div>
  </div>

  <section class="summary" id="summary"></section>
  <div class="banner" id="banner" hidden></div>
  <div class="sugbar" id="sugbar" hidden></div>

  <div class="toolbar">
    <div class="seg" id="kind">
      <button data-kind="" class="on">All</button><button data-kind="movie">Movies</button><button data-kind="show">Shows</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input type="search" id="q" placeholder="Search titles" autocomplete="off" aria-label="Search titles">
    </label>
    <span class="sortbox">Sort
      <select id="sort" aria-label="Sort by">
        <option value="score">Score</option><option value="size">Size</option><option value="title">Title</option>
        <option value="added">Time on Plex</option><option value="plays">Plays</option><option value="last">Last played</option><option value="res">Quality</option>
      </select>
      <button class="icon-btn" id="dir" title="Reverse the order" aria-label="Reverse the order"></button>
    </span>
    <button class="icon-btn" id="weights-btn" title="Scoring weights" aria-label="Scoring weights">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="8" cy="5" r="1.8" fill="var(--panel)"/><circle cx="13" cy="10" r="1.8" fill="var(--panel)"/><circle cx="6" cy="15" r="1.8" fill="var(--panel)"/></svg>
    </button>
    <div class="seg" id="viewseg">
      <button data-view="grid" title="Posters" aria-label="Poster grid"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg></button>
      <button data-view="list" title="List" aria-label="List"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="3" width="16" height="3" rx="1.2"/><rect x="2" y="8.5" width="16" height="3" rx="1.2"/><rect x="2" y="14" width="16" height="3" rx="1.2"/></svg></button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="weights" id="weights" hidden>
    <div class="weights-head"><b>How much each factor counts</b><span class="muted" id="weights-status">Only the proportions matter. Changes save automatically.</span></div>
    <div class="weights-grid" id="weights-grid"></div>
  </div>
  <p class="resultline"><span id="resultline"></span><button class="linkbtn" id="clear-filters" hidden>Clear filters</button></p>

  <div class="grid" id="grid" hidden></div>
  <div class="tablewrap" id="list" hidden>
    <table>
      <thead><tr>
        <th class="ck"><input type="checkbox" id="ck-all" title="Select all shown" aria-label="Select all shown"></th>
        <th data-sort="title">Title<span class="arr"></span></th>
        <th data-sort="score" class="num">Score<span class="arr"></span></th>
        <th data-sort="size" class="num">Size<span class="arr"></span></th>
        <th data-sort="added" class="num col-added">On Plex<span class="arr"></span></th>
        <th data-sort="plays" class="num">Plays<span class="arr"></span></th>
        <th data-sort="last" class="num col-last">Last played<span class="arr"></span></th>
        <th data-sort="res" class="num col-q">Quality<span class="arr"></span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="empty" hidden></div>
  <button class="more" id="more" hidden></button>
</div>

<div class="selbar" id="selbar" hidden>
  <span><b id="sel-n"></b> selected · <b id="sel-size"></b></span>
  <button class="btn danger" id="sel-mark">Mark for removal</button>
  <button class="btn danger" id="sel-now" title="Titles that aren't in Plex skip Leaving Soon">Remove now</button>
  <button class="btn" id="sel-clear">Clear</button>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
fetch('/healthz').then(r => r.json()).then(j => { document.getElementById('app-version').textContent = j.version; }).catch(() => {});
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem("karlstodian." + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("karlstodian." + k, v); } catch {} },
};

let items = [], lowRes = 720;
let state = { kind: "", q: "", f: new Set(), sort: "score", dir: -1, shown: 0, openId: null, sel: new Set(),
              view: store.get("view") === "list" ? "list" : "grid" };
const pageSize = () => state.view === "grid" ? 120 : 200;
state.shown = pageSize();
let removalInfo = { dry_run: true, grace_days: 14, plex_sync_error: null };
let suggestInfo = null; // GET /api/suggestions
const FACTOR_INFO = {
  size: ["Size", "Bigger titles score higher"],
  age: ["Age", "Longer on Plex scores higher"],
  watch: ["Watching", "Less watched, and longer ago, scores higher"],
  quality: ["Quality", "More low-resolution content scores higher"],
};
let weights = { size: 30, age: 20, watch: 40, quality: 10 };

function liveScore(i) {
  if (!i.factors || i.excluded) return null;
  const wsum = Object.values(weights).reduce((a, b) => a + b, 0);
  if (!wsum) return 0;
  return Object.keys(weights).reduce((s, k) => s + weights[k] * i.factors[k].score, 0) / wsum;
}
const heat = sc => sc === null ? "na" : sc >= 75 ? "hot" : sc >= 50 ? "warm" : "cool";

// ---------------------------------------------------------------- formatting
function bytes(b) {
  if (!b) return "0 GB";
  if (b >= 1e12) return (b / 1e12).toFixed(b >= 1e13 ? 1 : 2) + " TB";
  if (b >= 1e9) return (b / 1e9).toFixed(b >= 1e11 ? 0 : 1) + " GB";
  return (b / 1e6).toFixed(0) + " MB";
}
function ago(iso) {
  if (!iso) return null;
  const d = (Date.now() - new Date(iso)) / 864e5;
  if (d < 1 / 1440) return "just now";
  if (d < 1 / 24) return `${Math.floor(d * 1440)} min ago`;
  if (d < 1) return `${Math.floor(d * 24)} h ago`;
  if (d < 31) return `${Math.floor(d)} d ago`;
  if (d < 365) return `${Math.floor(d / 30.4)} mo ago`;
  const y = d / 365.25;
  return `${y < 10 ? y.toFixed(1).replace(/\.0$/, "") : Math.floor(y)} y ago`;
}
function watchedShare(i) {
  if (i.kind !== "show") return 0;
  const eps = i.episode_count || 0;
  return eps ? Math.min(1, Math.max(i.watched_episodes_all || 0, i.watched_episode_count || 0) / eps) : 0;
}
function pctWatched(i) {
  const p = watchedShare(i) * 100;
  return p > 0 && p < 1 ? "<1%" : Math.round(p) + "%";
}
const date = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
const resLabel = r => r ? (r >= 2000 ? "4K" : r + "p") : "?";
function resRange(i) {
  if (!i.min_resolution) return "—";
  return i.min_resolution === i.max_resolution ? resLabel(i.min_resolution) : `${resLabel(i.min_resolution)}–${resLabel(i.max_resolution)}`;
}
function dur(sec) {
  if (!sec) return "—";
  const d = sec / 86400;
  return d >= 1 ? `${d >= 10 ? Math.round(d) : d.toFixed(1)} days` : `${Math.round(sec / 3600)} h`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function playsText(i) {
  if (!i.in_plex) return "Not in Plex";
  if (i.kind === "show") return watchedShare(i) === 0 ? "0% watched" : `${pctWatched(i)} watched`;
  return i.play_count === 0 ? "Never played" : plural(i.play_count, "play");
}

// ---------------------------------------------------------------- images
// Posters come through Karlstodian (/api/items/{id}/image/...), cached there; ?v= changes when Plex's poster does.
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const imgUrl = (i, kind) => `/api/items/${i.id}/image/${kind}?v=${encodeURIComponent((kind === "art" ? i.plex_art : i.plex_thumb) || i.key)}`;
function posterHtml(i, cls = "pimg") {
  return `<div class="ph" style="--h:${hue(i.title)}"><span>${esc(i.title)}</span></div>
    <img class="${cls}" src="${imgUrl(i, "poster")}" alt="" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.remove()">`;
}

// ---------------------------------------------------------------- data
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
}
async function loadItems() {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const r = await api("GET", `/api/items?limit=1000&offset=${off}&sort=title`);
    out.push(...r.items);
    if (r.weights) weights = { ...weights, ...r.weights };
    if (off + 1000 >= r.total) break;
  }
  items = out;
}

const isLow = i => i.low_quality_bytes > 0;
const isNever = i => i.in_plex && i.play_count === 0;
const isKept = i => i.keep_effective || i.quality_exempt_effective;
const isLeaving = i => !!i.removal;
const canMark = i => i.in_plex && !i.keep_effective && !i.removal;
const canRemoveNow = i => !i.in_plex && !i.keep_effective && !i.removal; // nobody can watch it, so no grace period
const canSelect = i => canMark(i) || canRemoveNow(i);
const isSuggested = i => !!i.suggested_at && canMark(i);
const FILTERS = { suggested: isSuggested, leaving: isLeaving, never: isNever, lowq: i => isLow(i) && !i.quality_exempt_effective,
                  noplex: i => !i.in_plex, kept: isKept };
const CHIPS = [["suggested", "Suggested"], ["leaving", "Leaving Soon"], ["never", "Never played"], ["lowq", "Low quality"],
               ["noplex", "Not in Plex"], ["kept", "Protected / exempt"]];
function untilText(iso) {
  const d = (new Date(iso) - Date.now()) / 864e5;
  if (d <= 0) return "due now";
  if (d < 1) return `in ${Math.max(1, Math.round(d * 24))} h`;
  return `in ${Math.ceil(d)} day${Math.ceil(d) === 1 ? "" : "s"}`;
}
async function loadRemovalInfo() {
  try {
    const r = await api("GET", "/api/removals");
    removalInfo = { dry_run: r.dry_run, grace_days: r.grace_days, plex_sync_error: r.plex_sync_error };
  } catch {}
  try { suggestInfo = await api("GET", "/api/suggestions"); } catch {}
}
const SORTERS = {
  score: i => liveScore(i),
  title: i => i.title.toLowerCase(),
  size: i => i.size_bytes,
  added: i => i.plex_added_at ? -new Date(i.plex_added_at) : null,   // larger = older
  plays: i => i.kind === "show" ? watchedShare(i) * 1000 + i.play_count / 1e6 : i.play_count,
  last: i => i.last_played_at ? new Date(i.last_played_at).getTime() : null,
  res: i => i.min_resolution,
};
const DEFAULT_DIR = { score: -1, title: 1, size: -1, added: -1, plays: 1, last: 1, res: 1 };

function view() {
  const q = state.q.trim().toLowerCase();
  let v = items.filter(i =>
    (!state.kind || i.kind === state.kind) &&
    (!q || i.title.toLowerCase().includes(q)) &&
    [...state.f].every(f => FILTERS[f](i)));
  const key = SORTERS[state.sort], dir = state.dir;
  v.sort((a, b) => {
    const x = key(a), y = key(b);
    if (x === y) return a.title.localeCompare(b.title);
    if (x === null || x === undefined) return 1;      // blanks always last
    if (y === null || y === undefined) return -1;
    return (x < y ? -1 : 1) * dir;
  });
  return v;
}

// ---------------------------------------------------------------- render: top
const sum = a => a.reduce((s, i) => s + i.size_bytes, 0);
function renderSummary() {
  const mv = items.filter(i => i.kind === "movie"), sh = items.filter(i => i.kind === "show");
  const si = suggestInfo || {}, free = si.free_bytes, goal = si.goal_bytes || 0, coming = si.leaving_bytes || 0;
  let disk = "";
  if (free !== null && free !== undefined) {
    const scale = Math.max(goal, free + coming, 1);
    const short = goal && free < goal;
    disk = `<div class="disk">
      <div class="row"><span><b>${bytes(free)}</b> free${coming ? ` · ${bytes(coming)} on its way out` : ""}</span>${goal ? `<span>goal <b>${bytes(goal)}</b></span>` : ""}</div>
      <div class="meter ${short ? "short" : ""}" title="${goal ? `Free space vs the ${bytes(goal)} goal` : "Free space"}">
        <i class="free" style="width:${free / scale * 100}%"></i><i class="coming" style="width:${coming / scale * 100}%"></i></div>
    </div>`;
  }
  $("#summary").innerHTML = items.length ? `<div>
      <div class="total">${bytes(sum(items))}</div>
      <div class="split"><b>${mv.length}</b> movies · ${bytes(sum(mv))} &nbsp;·&nbsp; <b>${sh.length}</b> shows · ${bytes(sum(sh))}</div>
    </div>${disk}` : "";
}
function renderBanner() {
  const b = $("#banner"), msgs = [];
  if (removalInfo.dry_run && items.some(isLeaving)) msgs.push(`Dry run is on: titles leaving soon will only be logged, not deleted. See <a href="/removals">Removals</a>.`);
  if (removalInfo.plex_sync_error) msgs.push(esc(removalInfo.plex_sync_error));
  b.hidden = !msgs.length;
  b.innerHTML = msgs.join("<br>");
}
function renderSugbar() {
  const bar = $("#sugbar"), sg = items.filter(isSuggested);
  bar.hidden = !sg.length;
  if (!sg.length) return;
  const filtered = state.f.size === 1 && state.f.has("suggested");
  bar.innerHTML = `<span class="grow"><span class="dot"></span><b>${plural(sg.length, "title")}</b> (${bytes(sum(sg))}) suggested for removal.</span>` +
    (!filtered ? `<button class="btn" data-sug-show>Review</button>` : "") +
    `<button class="btn danger" data-sug-all>Approve all</button>`;
}
function renderChips() {
  const base = items.filter(i => !state.kind || i.kind === state.kind);
  $("#chips").innerHTML = CHIPS.map(([k, label]) => {
    const m = base.filter(FILTERS[k]);
    const size = k === "lowq" ? m.reduce((s, i) => s + i.low_quality_bytes, 0) : sum(m);
    const sub = k === "leaving" && m.length ? `${m.length} · next ${untilText(m.map(i => i.removal.remove_after).sort()[0])}` : `${m.length} · ${bytes(size)}`;
    return `<button class="chip ${state.f.has(k) ? "on" : ""} ${m.length ? "" : "zero"}" data-f="${k}">${label}<span class="n">${sub}</span></button>`;
  }).join("");
}

// ---------------------------------------------------------------- render: grid
function cardFlags(i) {
  return [
    isSuggested(i) ? `<span class="flag sugg">Suggested</span>` : "",
    i.removal ? `<span class="flag leave">Leaving ${untilText(i.removal.remove_after)}</span>` : "",
    i.keep_effective ? `<span class="flag keep">Protected</span>` : "",
    !i.in_plex ? `<span class="flag noplex">Not in Plex</span>` : "",
  ].join("");
}
function card(i) {
  const sc = liveScore(i);
  const score = sc === null ? `<span class="sc na" title="${esc(i.excluded || "")}">—</span>` : `<span class="sc ${heat(sc)}">${Math.round(sc)}</span>`;
  const pick = canSelect(i) ? `<label class="pick" title="Select"><input type="checkbox" data-ck="${i.id}" ${state.sel.has(i.id) ? "checked" : ""} aria-label="Select ${esc(i.title)}"></label>` : "";
  return `<div class="card ${state.openId === i.id ? "sel" : ""} ${state.sel.has(i.id) ? "picked" : ""}" data-id="${i.id}">
    <div class="poster">${posterHtml(i)}<div class="shade-b"></div>${score}<span class="psize">${bytes(i.size_bytes)}</span>
      <div class="flags">${cardFlags(i)}</div>${pick}</div>
    <div class="cap"><div class="t" title="${esc(i.title)}">${esc(i.title)}</div>
      <div class="m">${[i.year, i.kind === "show" ? "Show" : null, playsText(i)].filter(Boolean).join(" · ")}</div></div>
  </div>`;
}

// ---------------------------------------------------------------- render: list
function row(i, maxSize) {
  const low = isLow(i), ex = i.quality_exempt_effective;
  const badges = [
    i.kind === "show" ? `<span class="badge">Show</span>` : "",
    !i.in_plex ? `<span class="badge warn">Not in Plex</span>` : "",
    i.keep_effective ? `<span class="badge ok">Protected</span>` : "",
    isSuggested(i) ? `<span class="badge sugg" title="${esc(i.suggest_reason || "")}">Suggested</span>` : "",
    i.removal ? `<span class="badge leave" title="Removal due ${esc(date(i.removal.remove_after))}">Leaving ${untilText(i.removal.remove_after)}</span>` : "",
  ].join("");
  const ck = `<td class="ck"><input type="checkbox" data-ck="${i.id}" ${state.sel.has(i.id) ? "checked" : ""} ${canSelect(i) ? "" : "disabled"}
    title="${canSelect(i) ? "Select" : i.removal ? "Already leaving" : "Protected"}" aria-label="Select ${esc(i.title)}"></td>`;
  const viewers = `<span class="sub"> · ${i.unique_viewers} ${i.unique_viewers === 1 ? "viewer" : "viewers"}</span>`;
  const plays = !i.in_plex ? `<span class="never">—</span>`
    : i.kind === "show" ? (watchedShare(i) === 0 ? `<span class="never">0% watched</span>`
        : `${pctWatched(i)} watched${i.unique_viewers ? viewers : ""}`)
    : i.play_count === 0 ? `<span class="never">0</span>`
    : `${i.play_count}${viewers}`;
  const sc = liveScore(i);
  const scoreCell = sc === null ? `<span class="excl">${esc(i.excluded || "—")}</span>`
    : `<div class="scorecell">${Math.round(sc)}<span class="scorebar ${heat(sc)}"><i style="width:${Math.max(2, sc)}%"></i></span></div>`;
  return `<tr data-id="${i.id}" class="${state.openId === i.id ? "sel" : ""}">
    ${ck}
    <td><div class="tcell"><div class="thumb">${posterHtml(i)}</div>
      <div><span class="title">${esc(i.title)}</span> <span class="sub">${i.year ?? ""}</span>${badges}</div></div></td>
    <td class="num">${scoreCell}</td>
    <td class="num"><div class="sizecell">${bytes(i.size_bytes)}<span class="sizebar"><i style="width:${Math.max(2, i.size_bytes / maxSize * 100)}%"></i></span></div></td>
    <td class="num col-added">${ago(i.plex_added_at) ?? "—"}</td>
    <td class="num">${plays}</td>
    <td class="num col-last">${ago(i.last_played_at) ?? `<span class="never">Never</span>`}</td>
    <td class="num col-q"><span class="${low ? (ex ? "q-ex" : "q-low") : ""}">${resRange(i)}</span></td>
  </tr>`;
}

function render() {
  const v = view(), shown = v.slice(0, state.shown);
  const grid = state.view === "grid";
  $("#grid").hidden = !grid || !v.length; $("#list").hidden = grid || !v.length;
  if (grid) $("#grid").innerHTML = shown.map(card).join("");
  else {
    const maxSize = Math.max(1, ...items.map(i => i.size_bytes));
    $("#rows").innerHTML = shown.map(i => row(i, maxSize)).join("");
    for (const th of $$("th[data-sort]")) $(".arr", th).textContent = th.dataset.sort === state.sort ? (state.dir === 1 ? "↑" : "↓") : "";
  }
  $("#resultline").textContent = items.length ? `${v.length === items.length ? "All" : v.length + " of"} ${plural(items.length, "title")} · ${bytes(sum(v))}` : "";
  $("#clear-filters").hidden = !(state.f.size || state.q || state.kind);
  const more = $("#more");
  more.hidden = v.length <= state.shown;
  more.textContent = `Show ${Math.min(pageSize(), v.length - state.shown)} more`;
  const empty = $("#empty");
  empty.hidden = v.length > 0;
  if (!items.length) empty.innerHTML = `No data yet. Set up your services in <a href="/settings">Settings</a>, then press <b>Scan now</b>.`;
  else empty.textContent = "Nothing matches these filters.";
  $$("#kind button").forEach(b => b.classList.toggle("on", b.dataset.kind === state.kind));
  $$("#viewseg button").forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
  $("#sort").value = state.sort;
  $("#dir").innerHTML = state.dir === 1
    ? `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M5 9l5-5 5 5"/></svg>`
    : `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12M5 11l5 5 5-5"/></svg>`;
  renderSummary();
  renderChips();
  renderSugbar();
  renderBanner();
  renderSel(v);
}

function renderSel(v = view()) {
  for (const id of [...state.sel]) { const i = items.find(x => x.id === id); if (!i || !canSelect(i)) state.sel.delete(id); }
  const chosen = items.filter(i => state.sel.has(i.id));
  document.body.classList.toggle("selecting", chosen.length > 0);
  $$(".card[data-id]").forEach(c => c.classList.toggle("picked", state.sel.has(+c.dataset.id)));
  $("#selbar").hidden = !chosen.length;
  $("#sel-n").textContent = plural(chosen.length, "title");
  $("#sel-size").textContent = bytes(sum(chosen));
  const nMark = chosen.filter(canMark).length, nNow = chosen.filter(canRemoveNow).length;
  $("#sel-mark").hidden = !nMark; $("#sel-now").hidden = !nNow;
  const mixed = nMark && nNow;
  $("#sel-mark").textContent = mixed ? `Mark ${nMark} for removal` : "Mark for removal";
  $("#sel-now").textContent = mixed ? `Remove ${nNow} not in Plex now` : "Remove now";
  const markable = v.slice(0, state.shown).filter(canSelect);
  const all = $("#ck-all");
  all.checked = markable.length > 0 && markable.every(i => state.sel.has(i.id));
  all.indeterminate = !all.checked && markable.some(i => state.sel.has(i.id));
}

// ---------------------------------------------------------------- actions
async function refreshAll() { await loadItems(); await loadRemovalInfo(); render(); }

async function markForRemoval(ids) {
  const n = ids.length, size = bytes(sum(items.filter(i => ids.includes(i.id))));
  const when = removalInfo.grace_days ? `in ${removalInfo.grace_days} days` : "at the next check";
  if (!confirm(`Put ${plural(n, "title")} (${size}) in Leaving Soon?\n\nThey'll be listed in a "Leaving Soon" collection in Plex and removed ${when}` +
      (removalInfo.dry_run ? " (dry run: nothing is deleted while dry run is on in Settings)." : ".") +
      `\nYou can keep any of them until then.`)) return false;
  try {
    const r = await api("POST", "/api/removals", { item_ids: ids });
    const refused = Object.entries(r.refused || {});
    if (refused.length) alert(`Not listed:\n` + refused.map(([id, why]) => `${(items.find(i => i.id === +id) || {}).title || id}: ${why}`).join("\n"));
  } catch (e) { alert(`Couldn't mark: ${e.message}`); return false; }
  for (const id of ids) state.sel.delete(id);
  await refreshAll();
  return true;
}

/** Titles that aren't in Plex: no Leaving Soon, they're removed straight away. */
async function removeNotInPlex(ids) {
  const chosen = items.filter(i => ids.includes(i.id)), n = chosen.length;
  const size = bytes(sum(chosen));
  const names = chosen.slice(0, 8).map(i => `  ${i.title}${i.year ? ` (${i.year})` : ""}`).join("\n") + (n > 8 ? `\n  and ${n - 8} more` : "");
  if (!confirm(removalInfo.dry_run
      ? `Remove ${n} title${n === 1 ? " that isn't" : "s that aren't"} in Plex (${size})?\n\n${names}\n\nDry run is on, so it's only logged.`
      : `Remove ${n} title${n === 1 ? " that isn't" : "s that aren't"} in Plex (${size}) now?\n\n${names}\n\n` +
        `Their files are deleted through Radarr/Sonarr, and their torrents once they've seeded long enough. ` +
        `If a title is only missing from Plex because it's matched wrong, fix that in Plex instead. This can't be undone.`)) return false;
  try {
    const r = await api("POST", "/api/removals", { item_ids: ids, now: true });
    const lines = [];
    for (const x of r.marked || []) if (x.state === "failed") lines.push(`${x.title}: failed, ${x.error || "see the Removals page"}`);
    for (const [id, why] of Object.entries(r.refused || {})) lines.push(`${(items.find(i => i.id === +id) || {}).title || id}: ${why}`);
    if (lines.length) alert(`Not removed:\n` + lines.join("\n"));
  } catch (e) { alert(`Couldn't remove: ${e.message}`); return false; }
  for (const id of ids) state.sel.delete(id);
  await refreshAll();
  return true;
}

async function keepIt(removalId) {
  try { await api("DELETE", `/api/removals/${removalId}`); }
  catch (e) { alert(`Couldn't keep it: ${e.message}`); return; }
  await refreshAll();
  if (state.openId) openItem(state.openId);
}

// ---------------------------------------------------------------- detail drawer
function resBreakdown(files) {
  const g = {};
  for (const f of files) {
    const k = f.resolution || 0;
    g[k] ??= { n: 0, size: 0 };
    g[k].n++; g[k].size += f.size;
  }
  return Object.entries(g).sort((a, b) => b[0] - a[0]).map(([r, x]) => ({ r: +r, ...x }));
}
const base = p => p.split(/[\\/]/).pop();

function toggleHtml(field, label, help, checked, viaTag) {
  return `<label class="toggle"><div><b>${label}</b><span>${viaTag ? `Set by the <code>${esc(viaTag)}</code> tag in Radarr/Sonarr` : help}</span></div>
    <span class="sw"><input type="checkbox" data-flag="${field}" ${checked ? "checked" : ""} ${viaTag ? "disabled" : ""}><i></i></span></label>`;
}

function heroHtml(d) {
  const sc = liveScore(d);
  const tags = d.arr_tags || [];
  return `<div class="hero">
    <img class="art" src="${imgUrl(d, "art")}" alt="" onload="this.classList.add('ok')" onerror="this.remove()">
    <button class="x" data-close aria-label="Close">×</button>
    <div class="hero-body">
      <div class="hposter">${posterHtml(d)}</div>
      <div class="hinfo"><h2>${esc(d.title)}</h2>
        <div class="meta">${[d.year, d.kind === "show" ? "TV show" : "Movie", bytes(d.size_bytes), resRange(d)].filter(Boolean).join(" · ")}</div>
        ${tags.length ? `<div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="hscore ${heat(sc)}"><b>${sc === null ? "—" : Math.round(sc)}</b><span>${sc === null ? "not scored" : "score"}</span></div>
    </div></div>`;
}

function actionHtml(d) {
  if (d.removal) return `<div class="action leave"><div class="head">Leaving Soon · ${untilText(d.removal.remove_after)}</div>
      <div class="muted">Removal due ${esc(date(d.removal.remove_after))}. It's in the Leaving Soon collection in Plex; if anyone finishes watching it before then, it stays.</div>
      <div class="row"><button class="btn" data-keep="${d.removal.id}">Keep it</button><button class="btn danger" data-remove-now="${d.removal.id}">Remove now</button></div></div>`;
  if (isSuggested(d)) return `<div class="action sugg"><div class="head">Suggested for removal</div>
      <div class="muted">${esc(d.suggest_reason || "")}. Approve puts it in Leaving Soon for ${removalInfo.grace_days} days; dismiss and it won't be suggested again.</div>
      <div class="row"><button class="btn danger" data-mark="${d.id}">Approve</button><button class="btn" data-dismiss="${d.id}">Dismiss</button></div></div>`;
  if (canMark(d)) return `${d.suggest_dismissed ? `<p class="muted" style="margin:14px 0 0">You dismissed this from suggestions. <button class="linkbtn" data-undismiss="${d.id}">Allow suggesting it again</button></p>` : ""}
      <div class="action mark"><span>Put it in Leaving Soon; it's removed after ${removalInfo.grace_days} days unless someone watches it.</span>
      <button class="btn danger" data-mark="${d.id}">Mark for removal</button></div>`;
  if (canRemoveNow(d)) return `<div class="action mark"><span>Nobody can watch it in Plex, so it skips Leaving Soon and is removed right away.</span>
      <button class="btn danger" data-now="${d.id}">Remove now</button></div>`;
  return "";
}

async function openItem(id) {
  state.openId = id;
  $$("tbody tr").forEach(tr => tr.classList.toggle("sel", +tr.dataset.id === id));
  $$(".card[data-id]").forEach(c => c.classList.toggle("sel", +c.dataset.id === id));
  const dr = $("#drawer");
  const known = items.find(i => i.id === id);
  // show the header straight away from the list; the details follow
  if (known && !(window.__detail && window.__detail.id === id && dr.classList.contains("open")))
    dr.innerHTML = heroHtml(known) + `<div class="d-body"><p class="muted">Loading…</p></div>`;
  dr.classList.add("open"); $("#shade").classList.add("open"); dr.setAttribute("aria-hidden", "false");
  let d;
  try { d = await api("GET", `/api/items/${id}`); }
  catch (e) { dr.innerHTML = `<div class="d-body" style="padding-top:20px"><button class="btn" data-close>Close</button><p class="muted">Couldn't load: ${esc(e.message)}</p></div>`; return; }
  if (state.openId !== id) return;
  window.__detail = d;
  const tags = d.arr_tags || [];
  const keepTag = !d.keep && d.keep_effective ? tags.find(t => /keep/i.test(t)) || "keep" : null;
  const exTag = !d.quality_exempt && d.quality_exempt_effective ? tags.find(t => /quality/i.test(t)) || "quality" : null;
  const linked = d.files.filter(f => f.torrent_hash).length;
  const torrentNames = new Set(d.torrents.map(t => t.hash));
  const missingTorrents = new Set(d.files.filter(f => f.torrent_hash && !torrentNames.has(f.torrent_hash)).map(f => f.torrent_hash)).size;

  dr.innerHTML = heroHtml(d) + `<div class="d-body">
    ${!d.in_plex ? `<div class="note">Not found in Plex, so there's no age or watch data. It may be missing from Plex or matched to the wrong title.</div>` : ""}
    ${actionHtml(d)}
    <div class="toggles">
      ${toggleHtml("keep", "Protect", "Never suggest removing this", d.keep_effective, keepTag)}
      ${toggleHtml("quality_exempt", "Quality exempt", `Don't count ${lowRes}p-or-lower against it`, d.quality_exempt_effective, exTag)}
    </div>

    <div class="d-sec" id="why-sec">${whyHtml(d)}</div>

    <div class="d-sec"><h3>Overview</h3><div class="stats">
      ${d.kind === "show"
        ? `<div><div class="k">Episodes watched</div><div class="v">${d.in_plex ? `${Math.min(d.episode_count, Math.max(d.watched_episodes_all, d.watched_episode_count))} / ${d.episode_count}` : "—"}</div></div>
           <div><div class="k">Share watched</div><div class="v">${d.in_plex ? pctWatched(d) : "—"}</div></div>`
        : `<div><div class="k">Plays (all users)</div><div class="v">${d.in_plex ? d.play_count : "—"}</div></div>
           <div><div class="k">Viewers</div><div class="v">${d.in_plex ? d.unique_viewers : "—"}</div></div>`}
      <div><div class="k">Last played</div><div class="v">${d.last_played_at ? ago(d.last_played_at) : "Never"}</div></div>
      <div><div class="k">Added to Plex</div><div class="v">${date(d.plex_added_at)}</div></div>
      <div><div class="k">On Plex for</div><div class="v">${(ago(d.plex_added_at) || "—").replace(" ago", "")}</div></div>
      <div><div class="k">Plex views</div><div class="v">${d.in_plex ? d.plex_view_count : "—"}</div></div>
    </div></div>

    <div class="d-sec"><h3>Watched by</h3>
      ${d.user_plays.length ? `<table class="mini"><thead><tr><th>User</th>${d.kind === "show" ? `<th class="num">Episodes</th>` : ""}<th class="num">Plays</th><th class="num">Last played</th></tr></thead><tbody>
        ${d.user_plays.map(u => `<tr><td>${esc(u.user)}</td>${d.kind === "show" ? `<td class="num">${d.episode_count ? `${u.episodes_watched} · ${Math.round(100 * Math.min(1, u.episodes_watched / d.episode_count))}%` : u.episodes_watched}</td>` : ""}<td class="num">${u.plays}</td><td class="num">${date(u.last_played_at)}</td></tr>`).join("")}
      </tbody></table><p class="muted">Plays count sessions Tautulli marked as watched. Started-but-unfinished sessions show as 0 plays.</p>`
      : `<p class="muted">No one has watched this since Tautulli started recording history.</p>`}
    </div>

    <div class="d-sec"><h3>Quality</h3>
      <table class="mini"><thead><tr><th>Resolution</th><th class="num">Files</th><th class="num">Size</th></tr></thead><tbody>
        ${resBreakdown(d.files).map(g => `<tr><td class="${g.r && g.r <= lowRes ? (d.quality_exempt_effective ? "q-ex" : "q-low") : ""}">${resLabel(g.r)}</td><td class="num">${g.n}</td><td class="num">${bytes(g.size)}</td></tr>`).join("")}
      </tbody></table>
    </div>

    <div class="d-sec"><h3>Torrents</h3>
      ${d.torrents.length ? `<table class="mini"><thead><tr><th>Name</th><th class="num">Ratio</th><th class="num">Seeded</th></tr></thead><tbody>
        ${d.torrents.map(t => `<tr><td class="mono">${esc(t.name)}<div class="muted">${esc(t.state || "")}${t.category ? " · " + esc(t.category) : ""}</div></td><td class="num">${t.ratio.toFixed(2)}</td><td class="num">${dur(t.seeding_time)}</td></tr>`).join("")}
      </tbody></table>` : ""}
      <p class="muted">${linked} of ${plural(d.files.length, "file")} linked to a torrent through Radarr/Sonarr history${missingTorrents ? `; ${missingTorrents} of those torrents are no longer in qBittorrent` : ""}.</p>
    </div>

    <div class="d-sec"><h3>Files</h3>
      <details ${d.files.length <= 3 ? "open" : ""}><summary>${plural(d.files.length, "file")}</summary>
        <table class="mini"><tbody>${d.files.map(f => `<tr><td class="mono" title="${esc(f.path)}">${esc(base(f.path))}</td><td class="num">${resLabel(f.resolution)}</td><td class="num">${bytes(f.size)}</td></tr>`).join("")}</tbody></table>
      </details>
    </div></div>`;
}

function whyHtml(d) {
  const sc = liveScore(d);
  const wsum = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  const head = sc === null
    ? `<div class="note" style="margin:0 0 6px">Not scored: ${esc(d.excluded)}. The factors below are shown for reference.</div>`
    : "";
  const rows = Object.keys(FACTOR_INFO).map(k => {
    const f = d.factors[k], pts = weights[k] / wsum * f.score;
    return `<tr><td class="f">${FACTOR_INFO[k][0]}</td>
      <td>${esc(f.note)}<div class="bar"><i style="width:${f.score}%"></i></div></td>
      <td class="pts">${sc === null ? Math.round(f.score) + "/100" : `+${pts.toFixed(1)}`}<div class="muted">${Math.round(weights[k] / wsum * 100)}% weight</div></td></tr>`;
  }).join("");
  return `<h3>Why this score</h3>` + head + `<table class="why"><tbody>${rows}</tbody></table>`;
}

function refreshWhy() {
  const sec = $("#why-sec");
  if (sec && state.openId && window.__detail && window.__detail.id === state.openId) sec.innerHTML = whyHtml(window.__detail);
  const hs = $("#drawer .hscore");
  if (hs && window.__detail) { const sc = liveScore(window.__detail); hs.className = `hscore ${heat(sc)}`; $("b", hs).textContent = sc === null ? "—" : Math.round(sc); }
}

// ---------------------------------------------------------------- weights
function renderWeights() {
  $("#weights-grid").innerHTML = Object.entries(FACTOR_INFO).map(([k, [label, help]]) => `
    <div class="w"><label for="w-${k}"><b>${label}</b><span id="wv-${k}">${Math.round(weights[k])}</span></label>
      <input type="range" id="w-${k}" data-w="${k}" min="0" max="100" step="5" value="${weights[k]}">
      <p>${help}</p></div>`).join("");
}
let saveTimer;
function onWeight(e) {
  const k = e.target.dataset.w; if (!k) return;
  weights[k] = +e.target.value;
  $(`#wv-${k}`).textContent = weights[k];
  render();
  refreshWhy();
  clearTimeout(saveTimer);
  $("#weights-status").textContent = "Saving…";
  saveTimer = setTimeout(async () => {
    try { await api("PUT", "/api/settings", { score_weights: weights }); $("#weights-status").textContent = "Saved. Suggestions were updated."; await refreshAll(); }
    catch (err) { $("#weights-status").textContent = `Couldn't save: ${err.message}`; }
  }, 600);
}

function closeDrawer() {
  state.openId = null;
  $("#drawer").classList.remove("open"); $("#shade").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  $$("tbody tr.sel, .card.sel").forEach(el => el.classList.remove("sel"));
}

async function setFlag(input) {
  const id = state.openId, field = input.dataset.flag, value = input.checked;
  input.disabled = true;
  try {
    const updated = await api("PATCH", `/api/items/${id}`, { [field]: value });
    const idx = items.findIndex(i => i.id === id);
    if (idx >= 0) items[idx] = { ...items[idx], ...updated };
    window.__detail = { ...(window.__detail || {}), ...updated };
    render();
    refreshWhy();
  } catch (e) { input.checked = !value; alert(`Couldn't save: ${e.message}`); }
  finally { input.disabled = false; }
}

// ---------------------------------------------------------------- scan
async function refreshScanStatus() {
  const [run] = await api("GET", "/api/scans?limit=1");
  const el = $("#scan-status"), btn = $("#scan-btn");
  if (!run) { el.textContent = "Never scanned"; el.className = "scan-status"; btn.disabled = false; return run; }
  const w = Object.keys(run.summary.warnings || {});
  if (run.status === "running") { el.textContent = "Scanning…"; btn.disabled = true; }
  else {
    btn.disabled = false;
    el.className = "scan-status" + (w.length ? " err" : "");
    el.textContent = `Scanned ${ago(run.finished_at || run.started_at)}` + (w.length ? ` · ${w.join(", ")} failed` : "");
    el.title = w.map(k => `${k}: ${run.summary.warnings[k]}`).join("\n");
  }
  return run;
}
async function scanNow() {
  $("#scan-btn").disabled = true; $("#scan-status").textContent = "Scanning…";
  try { await api("POST", "/api/scan"); } catch (e) { $("#scan-status").textContent = e.message; }
  for (let i = 0; i < 600; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const run = await refreshScanStatus().catch(() => null);
    if (run && run.status !== "running") break;
  }
  await refreshAll();
}

// ---------------------------------------------------------------- events
const reset = () => { state.shown = pageSize(); render(); };
$("#kind").onclick = e => { const b = e.target.closest("[data-kind]"); if (b) { state.kind = b.dataset.kind; reset(); } };
$("#viewseg").onclick = e => {
  const b = e.target.closest("[data-view]"); if (!b || b.dataset.view === state.view) return;
  state.view = b.dataset.view; store.set("view", state.view); reset();
};
$("#q").oninput = e => { state.q = e.target.value; reset(); };
$("#chips").onclick = e => { const c = e.target.closest("[data-f]"); if (!c) return; const f = c.dataset.f; state.f.has(f) ? state.f.delete(f) : state.f.add(f); reset(); };
$("#clear-filters").onclick = () => { state.f.clear(); state.kind = ""; state.q = ""; $("#q").value = ""; reset(); };
$("#sort").onchange = e => { state.sort = e.target.value; state.dir = DEFAULT_DIR[state.sort]; render(); };
$("#dir").onclick = () => { state.dir = -state.dir; render(); };
$("thead").onclick = e => {
  const th = e.target.closest("th[data-sort]"); if (!th) return;
  const s = th.dataset.sort;
  state.dir = state.sort === s ? -state.dir : DEFAULT_DIR[s];
  state.sort = s; render();
};
function onPick(e) {
  const ck = e.target.closest("[data-ck]");
  if (ck) { const id = +ck.dataset.ck; ck.checked ? state.sel.add(id) : state.sel.delete(id); renderSel(); return true; }
  return !!e.target.closest("td.ck, .pick");
}
$("#rows").onclick = e => { if (onPick(e)) return; const tr = e.target.closest("tr[data-id]"); if (tr) openItem(+tr.dataset.id); };
$("#grid").onclick = e => {
  if (onPick(e)) return;
  const c = e.target.closest(".card[data-id]"); if (!c) return;
  // while picking titles, a click on a poster toggles it instead of opening it
  const id = +c.dataset.id, i = items.find(x => x.id === id);
  if (state.sel.size && i && canSelect(i)) { state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); const ck = $(`[data-ck="${id}"]`, c); if (ck) ck.checked = state.sel.has(id); renderSel(); return; }
  openItem(id);
};
$("#ck-all").onclick = e => {
  const shown = view().slice(0, state.shown).filter(canSelect);
  for (const i of shown) e.target.checked ? state.sel.add(i.id) : state.sel.delete(i.id);
  render();
};
$("#sel-clear").onclick = () => { state.sel.clear(); render(); };
const selIds = f => items.filter(i => state.sel.has(i.id) && f(i)).map(i => i.id);
$("#sel-mark").onclick = async () => { const b = $("#sel-mark"); b.disabled = true; await markForRemoval(selIds(canMark)); b.disabled = false; };
$("#sel-now").onclick = async () => { const b = $("#sel-now"); b.disabled = true; await removeNotInPlex(selIds(canRemoveNow)); b.disabled = false; };
$("#more").onclick = () => { state.shown += pageSize(); render(); };
$("#sugbar").onclick = async e => {
  if (e.target.closest("[data-sug-show]")) { state.f.clear(); state.kind = ""; state.f.add("suggested"); reset(); }
  const all = e.target.closest("[data-sug-all]");
  if (all) { all.disabled = true; await markForRemoval(items.filter(isSuggested).map(i => i.id)); all.disabled = false; }
};
$("#shade").onclick = closeDrawer;
$("#drawer").addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) return closeDrawer();
  const m = e.target.closest("[data-mark]");
  if (m) { m.disabled = true; if (await markForRemoval([+m.dataset.mark])) openItem(+m.dataset.mark); else m.disabled = false; }
  const nw = e.target.closest("[data-now]");
  if (nw) { nw.disabled = true; if (await removeNotInPlex([+nw.dataset.now])) openItem(+nw.dataset.now); else nw.disabled = false; }
  const ds = e.target.closest("[data-dismiss], [data-undismiss]");
  if (ds) {
    ds.disabled = true;
    const id = +(ds.dataset.dismiss || ds.dataset.undismiss);
    try { await api("PATCH", `/api/items/${id}`, { suggest_dismissed: !!ds.dataset.dismiss }); } catch (err) { alert(err.message); }
    await refreshAll(); openItem(id);
  }
  const k = e.target.closest("[data-keep]");
  if (k) { k.disabled = true; await keepIt(+k.dataset.keep); }
  const rn = e.target.closest("[data-remove-now]");
  if (rn) {
    if (!confirm(removalInfo.dry_run ? "Run this removal now? Dry run is on, so it's only logged." : "Remove it now? Its files are deleted through Radarr/Sonarr, and its torrents once they've seeded long enough. This can't be undone.")) return;
    rn.disabled = true;
    try { await api("POST", `/api/removals/${rn.dataset.removeNow}/remove`); } catch (err) { alert(err.message); }
    await refreshAll(); openItem(state.openId);
  }
});
$("#drawer").addEventListener("change", e => { if (e.target.dataset.flag) setFlag(e.target); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#q").focus(); }
});
addEventListener("scroll", () => $("#top").classList.toggle("scrolled", scrollY > 4), { passive: true });
$("#scan-btn").onclick = scanNow;
$("#weights-btn").onclick = () => { const w = $("#weights"); w.hidden = !w.hidden; $("#weights-btn").classList.toggle("on", !w.hidden); };
$("#weights-grid").addEventListener("input", onWeight);

(async () => {
  try {
    const s = await api("GET", "/api/settings");
    lowRes = s.values.low_quality_max_resolution || 720;
  } catch {}
  const run = await refreshScanStatus().catch(() => null);
  await loadRemovalInfo();
  await loadItems().catch(e => { $("#empty").hidden = false; $("#empty").textContent = `Couldn't load: ${e.message}`; });
  renderWeights();
  render();
  if (run && run.status === "running") scanNow();
  setInterval(() => refreshScanStatus().catch(() => {}), 60000);
})();
</script>
</body>
</html>
