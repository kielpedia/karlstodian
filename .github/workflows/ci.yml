name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --console=plain
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-report
          path: build/reports/tests/test

  # Every merge to main becomes a release; the server's updater installs it within ~5 minutes.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildFatJar --console=plain -PappVersion=build-${{ github.run_number }}
      - name: Checksum
        working-directory: build/libs
        run: sha256sum karlstodian.jar > karlstodian.jar.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/libs/karlstodian.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" build/libs/karlstodian.jar build/libs/karlstodian.jar.sha256 \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

  # The container image: built and smoke-tested on every PR; on main also pushed to GHCR as
  # ghcr.io/<owner>/karlstodian:build-<n> and :latest (same number as the jar release).
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: karlstodian:ci
          build-args: APP_VERSION=build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p data && sudo chown 10001:10001 data
          docker run -d --name k -p 8000:8000 -v "$PWD/data:/data" karlstodian:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi; sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"build-${{ github.run_number }}"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/library
          test "$(docker inspect -f '{{.Config.User}}' karlstodian:ci)" = karlstodian
          sudo test -f data/pruner.db
          docker logs k
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:build-${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=build-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=build-${{ github.run_number }}
          cache-from: type=gha
      - uses: actions/attest-build-provenance@v4
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
